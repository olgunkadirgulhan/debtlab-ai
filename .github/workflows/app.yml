name: app
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build iOS (macOS minutes count 10x on private repos)"
        type: boolean
        default: false

env:
  FLUTTER_VERSION: "3.32.4"   # matches app/pubspec.lock

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK (installable test build)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: debtlab-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned, compile check until the Apple account exists)
        run: flutter build ios --release --no-codesign
