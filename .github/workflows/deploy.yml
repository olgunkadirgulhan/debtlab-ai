name: deploy-site
on:
  push:
    branches: [main]
    paths: ["web/**", "shared/**", ".github/workflows/deploy.yml"]
  # Bot commits (new video, new article) use GITHUB_TOKEN, which does not fire
  # `push` workflows, so redeploy after those workflows finish instead.
  workflow_run:
    workflows: [shorts, blog]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Set these as repo Variables (Settings > Secrets and variables > Actions > Variables).
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          NEXT_PUBLIC_CF_BEACON: ${{ vars.CF_BEACON }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name debtlab --branch main --commit-hash ${{ github.sha }}
