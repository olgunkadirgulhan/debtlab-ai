name: brand
# The Real Cost kanal kimliği: banner, açıklama; hide_old=true ise eski DebtLab Short'larını gizler (silmez).
on:
  workflow_dispatch:
    inputs:
      hide_old:
        description: Eski videoları gizle (true/false)
        default: "false"
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  brand:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests Pillow numpy soundfile google-api-python-client google-auth
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python youtube/realcost_brand.py --apply ${{ inputs.hide_old == 'true' && '--hide-old' || '' }}
      - name: Gizlenen listesini kaydet
        run: |
          git config user.name "debtlab-bot"; git config user.email "bot@users.noreply.github.com"
          git add youtube/hidden_old.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "realcost: gizlenen eski videolar"
          git stash -q -u || true
          git pull --rebase -q && git push -q
