name: blog
on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC (a failed day is simply retried the next day)
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start deploy-site after a new commit

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  write-article:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Write article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_REVIEW_FIRST: ${{ vars.BLOG_REVIEW_FIRST }}
        run: python blog/generate.py
      - name: Commit (Cloudflare Pages deploys on push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "debtlab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/content/blog/
          git diff --cached --quiet && exit 0
          git commit -m "blog: $(date -u +%F)"
          git pull --rebase
          git push
          gh workflow run deploy.yml --ref main
