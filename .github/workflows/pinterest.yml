name: pinterest
on:
  schedule:
    - cron: "17 14 * * *"   # 14:17 UTC = US morning
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow reportlab pymupdf
      - name: Build free PDF (pin images use its pages)
        run: python tools/planner/make_planner.py
      - name: Post pins
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
          PINS_PER_RUN: ${{ vars.PINS_PER_RUN }}
        run: python tools/pinterest/post.py
      - name: Commit log
        run: |
          git config user.name "debtlab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/pinterest/posted.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "pins: $(date -u +%F)"
          git pull --rebase
          git push
