name: long
# The Real Cost uzun videoları (16:9): günde 2 (15:00 ve 21:00 UTC slotları); slot_guard published_long.csv'ye bakar.
on:
  schedule:
    - cron: "41 14-23 * * *"
  workflow_dispatch:
    inputs:
      auto:
        description: Harici zamanlayıcı (cron-job.org) - planlı çalışma gibi davran
        type: boolean
        default: false
      dry_run:
        description: Render only, no upload
        type: boolean
        default: true
      kind:
        description: "car_all | card_all | home_all | loan_all | household (boş = rastgele)"
        default: ""
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  guard:
    if: github.event_name == 'schedule' || inputs.auto
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          LOG_FILE: youtube/published_long.csv
          SLOTS: "18:30"
          MIN_GAP_MIN: "120"
        run: python3 .github/slot_guard.py
  make:
    needs: guard
    if: always() && ((github.event_name != 'schedule' && !inputs.auto) || needs.guard.outputs.go == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/debtlab
          key: kokoro-v1.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install -r youtube/requirements.txt
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.auto }}" != "true" ] && [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ -n "${{ inputs.kind }}" ]; then ARGS="$ARGS --kind ${{ inputs.kind }}"; fi
          python youtube/realcost_long.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-${{ github.run_id }}
          path: youtube/out/realcost/long_*.mp4
          retention-days: 5
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "debtlab-bot"; git config user.email "bot@users.noreply.github.com"
          git add youtube/published_long.csv youtube/realcost_data.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "long: $(date -u +%F-%H%M)"
          git pull --rebase && git push
