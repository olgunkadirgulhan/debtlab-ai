name: shorts
on:
  schedule:
    # 3 videos/day at US viewing times (EDT): slots 16:00, 20:00, 22:00 UTC (12/16/18 ET).
    # Afternoon/evening ET got the most views on 09-22..26; the last slot stays before 23:00 UTC
    # so it gets two tries before the UTC day (and the daily count) rolls over.
    # Fired hourly by cron-job.org (auto=true) with this cron as a backup;
    # .github/slot_guard.py makes a video only when a slot is due and not yet uploaded.
    # MAX_PER_DAY in run.py stays the hard cap.
    - cron: "23 16-23 * * *"
  workflow_dispatch:
    inputs:
      auto:
        description: External scheduler call - follow the slot plan like a scheduled run
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'schedule' || inputs.auto
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          LOG_FILE: youtube/published.csv
          SLOTS: "16:00,20:00,22:00"
        run: python3 .github/slot_guard.py

  make-and-upload:
    needs: guard
    if: always() && ((github.event_name != 'schedule' && !inputs.auto) || needs.guard.outputs.go == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube/requirements.txt
      - name: Cache TTS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/debtlab
          key: kokoro-v1.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install -r youtube/requirements.txt
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY }}
        run: python youtube/run.py
      - name: Keep video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: youtube/out/*/video.mp4
          retention-days: 5
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "debtlab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A youtube/queue/ || true
          git add youtube/published.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "short: $(date -u +%F-%H%M)"
          git pull --rebase
          git push
